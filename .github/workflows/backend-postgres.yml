name: Backend PostgreSQL tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  POSTGRES_TEST_DB: trailverse_test
  POSTGRES_TEST_USER: trailverse_test
  POSTGRES_TEST_PASSWORD: trailverse_ci_password
  POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://trailverse_test:trailverse_ci_password@localhost:5432/trailverse_test
  DATABASE_URL: postgresql+psycopg://trailverse_test:trailverse_ci_password@localhost:5432/trailverse_test
  SECRET_KEY: trailverse-ci-only-not-production
  ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"
  PYTHONPATH: .

defaults:
  run:
    working-directory: virsa-backend

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_TEST_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_TEST_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_TEST_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trailverse_test -d trailverse_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: virsa-backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest -q tests/test_orders_postgres.py --junitxml=postgres-test-results.xml
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('postgres-test-results.xml').getroot(); suites = list(root.iter('testsuite')); skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in suites); tests = sum(int(suite.attrib.get('tests', '0')) for suite in suites); raise SystemExit('PostgreSQL integration tests were skipped' if skipped else ('PostgreSQL integration tests did not execute' if tests == 0 else 0))"

      - name: Run backend test suite
        run: |
          python -m pytest -q tests --ignore=tests/test_orders_postgres.py --junitxml=backend-test-results.xml
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('backend-test-results.xml').getroot(); skipped = sum(int(suite.attrib.get('skipped', '0')) for suite in root.iter('testsuite')); raise SystemExit('Backend test suite contains skipped tests' if skipped else 0)"
